spring:  
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:appdb}
    username: ${POSTGRES_USER:gauva}
    password: ${POSTGRES_PASSWORD:gauva}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: smtp.gmail.com
    port: 587
    username: german.teaching.yeah@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          ath: true
          starttls:
            enable: true

  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics
    health:
      db:
        enabled: true

app:
  # JWT Secret Key - should be at least 256 bits (32 characters) for HS256
  # In production, use environment variables or secure configuration
  jwtSecret: "uK8v@Y#9Lq2Wm7Pz4Bn0Xc6Rb1Tj3VhQ"
  # Access Token Expiration (short-lived for API requests)
  jwtExpirationMs: 90000 # 15 minutes
  # Refresh Token Expiration (long-lived for getting new access tokens)
  jwtRefreshExpirationMs: 604800000 # 7 days
  # Refresh token cleanup (optional)
  refreshTokenCleanupCron: "0 0 2 * * ?" # Run at 2 AM daily
  cors:
      allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
      - https://your-production-domain.com
  email:
    from-address: noreply@germanteaching.com
    from-name: German Teaching App
    base-url: https://germanteaching.com
    reset-token-expiration-hours: 24
    enabled: true
    app-name: German Teaching App

# Logging configuration
logging:
  level:
    com.example.germanteaching: DEBUG
    org.springframework.security: DEBUG


# Email Configuration for application.properties or application.yml

# ===== SMTP Configuration =====
# Gmail Configuration (for development/testing)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# Alternative: SendGrid Configuration
# spring.mail.host=smtp.sendgrid.net
# spring.mail.port=587
# spring.mail.username=apikey
# spring.mail.password=your-sendgrid-api-key

# Alternative: AWS SES Configuration
# spring.mail.host=email-smtp.us-east-1.amazonaws.com
# spring.mail.port=587
# spring.mail.username=your-aws-ses-smtp-username
# spring.mail.password=your-aws-ses-smtp-password

# ===== Custom Email Properties =====
# app.email.from-address=noreply@your-domain.com
# app.email.from-name=German Teaching App
# app.email.base-url=https://your-domain.com
# app.email.reset-token-expiration-hours=24
# app.email.enabled=true

# ===== Development Profile (application-dev.properties) =====
# For development, you might want to disable actual email sending
# app.email.enabled=false

# ===== Production Profile (application-prod.properties) =====
# Use environment variables for sensitive information
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# app.email.from-address=${EMAIL_FROM_ADDRESS}
# app.email.base-url=${APP_BASE_URL}

